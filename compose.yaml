x-app-variables: &app-variables
  PYTHONUNBUFFERED: "1"
  JWT_SECRET: ${JWT_SECRET:-local-compose-secret-not-for-production-2026}
  DATABASE_URL: postgresql://smartdelivery:${POSTGRES_PASSWORD:-smartdelivery-local}@postgres:5432/smartdelivery

x-app: &app
  image: ${SMARTDELIVERY_IMAGE:-smartdelivery:local}
  pull_policy: never
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdelivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdelivery-local}
      POSTGRES_DB: smartdelivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smartdelivery", "-d", "smartdelivery"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smartdelivery
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartdelivery-local}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  auth-service:
    <<: *app
    command: uvicorn src.auth_service.main:app --host 0.0.0.0 --port 8001
    environment: *app-variables
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    <<: *app
    command: uvicorn src.catalog_service.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *app-variables
      REDIS_URL: redis://redis:6379/0
      GRPC_PORT: 50051
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    <<: *app
    command: uvicorn src.order_service.main:app --host 0.0.0.0 --port 8003
    environment:
      <<: *app-variables
      CATALOG_GRPC_HOST: catalog-service:50051
      RABBITMQ_URL: amqp://smartdelivery:${RABBITMQ_PASSWORD:-smartdelivery-local}@rabbitmq:5672/%2F
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      catalog-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-service:
    <<: *app
    command: uvicorn src.delivery_service.main:app --host 0.0.0.0 --port 8004
    environment:
      <<: *app-variables
      RABBITMQ_URL: amqp://smartdelivery:${RABBITMQ_PASSWORD:-smartdelivery-local}@rabbitmq:5672/%2F
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    <<: *app
    command: uvicorn src.gateway.main:app --host 0.0.0.0 --port 8080
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      CATALOG_SERVICE_URL: http://catalog-service:8002
      ORDER_SERVICE_URL: http://order-service:8003
      DELIVERY_SERVICE_URL: http://delivery-service:8004
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  rabbitmq_data:
