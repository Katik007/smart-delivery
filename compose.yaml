services:
  gateway:
    image: ${GATEWAY_IMAGE:-smartdelivery-gateway:latest}
    build:
      context: .
      target: gateway
    restart: unless-stopped
    networks:
      default:
      proxy:
        aliases:
          - ${PROXY_APP_ALIAS:-kabanovae}
    environment:
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: http://auth-service:8080
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: http://catalog-service:8080
      ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address: http://order-service:8080
      ReverseProxy__Clusters__delivery-cluster__Destinations__destination1__Address: http://delivery-service:8080
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - delivery-service

  auth-service:
    image: ${AUTH_IMAGE:-smartdelivery-auth:latest}
    build:
      context: .
      target: auth
    restart: unless-stopped
    networks:
      - default
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartdelivery;Username=smartdelivery;Password=${POSTGRES_PASSWORD:-SmartDeliveryPostgresPassword2026!}"
      Redis__ConnectionString: "redis:6379"
      JwtSettings__Secret: "${JWT_SECRET:-SmartDeliverySecretKeySuperLongSecureKey2026!#$*&}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  catalog-service:
    image: ${CATALOG_IMAGE:-smartdelivery-catalog:latest}
    build:
      context: .
      target: catalog
    restart: unless-stopped
    networks:
      - default
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartdelivery;Username=smartdelivery;Password=${POSTGRES_PASSWORD:-SmartDeliveryPostgresPassword2026!}"
      Redis__ConnectionString: "redis:6379"
      JwtSettings__Secret: "${JWT_SECRET:-SmartDeliverySecretKeySuperLongSecureKey2026!#$*&}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  order-service:
    image: ${ORDER_IMAGE:-smartdelivery-order:latest}
    build:
      context: .
      target: order
    restart: unless-stopped
    networks:
      - default
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartdelivery;Username=smartdelivery;Password=${POSTGRES_PASSWORD:-SmartDeliveryPostgresPassword2026!}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Services__CatalogService__Url: "http://catalog-service:8080"
      JwtSettings__Secret: "${JWT_SECRET:-SmartDeliverySecretKeySuperLongSecureKey2026!#$*&}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      catalog-service:
        condition: service_started

  delivery-service:
    image: ${DELIVERY_IMAGE:-smartdelivery-delivery:latest}
    build:
      context: .
      target: delivery
    restart: unless-stopped
    networks:
      - default
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartdelivery;Username=smartdelivery;Password=${POSTGRES_PASSWORD:-SmartDeliveryPostgresPassword2026!}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      JwtSettings__Secret: "${JWT_SECRET:-SmartDeliverySecretKeySuperLongSecureKey2026!#$*&}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  db:
    image: postgres:17
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_DB: smartdelivery
      POSTGRES_USER: smartdelivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SmartDeliveryPostgresPassword2026!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartdelivery -d smartdelivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    networks:
      - default
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres-data:

networks:
  default:
  proxy:
    external: true
    name: nginx-proxy
