# GitLab CI/CD Pipeline для проекта SmartDelivery (Кабанова Екатерина)
# Выполняет:
# 1. Запуск Unit и Integration тестов (Требование 13)
# 2. Сборку многосервисных Docker образов в Container Registry
# 3. Деплой по SSH на сервер преподавателя в /home/kabanovae (Требование 14)

stages:
  - test
  - build
  - deploy

# ----------------------------------------------------
# 1. Стадия автоматического тестирования (Пункт 13)
# ----------------------------------------------------
test-job:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  timeout: 10 minutes
  script:
    - dotnet restore SmartDelivery.sln
    - dotnet build SmartDelivery.sln -c Release --no-restore
    - dotnet test SmartDelivery.sln -c Release --no-build --logger "junit;LogFilePath=test-results.xml"
  artifacts:
    when: always
    reports:
      junit: test-results.xml

# ----------------------------------------------------
# 2. Стадия сборки Docker образов (Пункт 4 и 14)
# ----------------------------------------------------
docker-build:
  stage: build
  image: docker:27.4.1-cli
  timeout: 15 minutes
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      echo "=== Сборка Docker образов SmartDelivery ==="
      # 1. Gateway
      docker build --target gateway -t "$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA"

      # 2. AuthService
      docker build --target auth -t "$CI_REGISTRY_IMAGE/auth:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE/auth:$CI_COMMIT_SHA"

      # 3. CatalogService
      docker build --target catalog -t "$CI_REGISTRY_IMAGE/catalog:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE/catalog:$CI_COMMIT_SHA"

      # 4. OrderService
      docker build --target order -t "$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA"

      # 5. DeliveryService
      docker build --target delivery -t "$CI_REGISTRY_IMAGE/delivery:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE/delivery:$CI_COMMIT_SHA"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/gateway:latest"
        docker push "$CI_REGISTRY_IMAGE/gateway:latest"

        docker tag "$CI_REGISTRY_IMAGE/auth:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/auth:latest"
        docker push "$CI_REGISTRY_IMAGE/auth:latest"

        docker tag "$CI_REGISTRY_IMAGE/catalog:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/catalog:latest"
        docker push "$CI_REGISTRY_IMAGE/catalog:latest"

        docker tag "$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/order:latest"
        docker push "$CI_REGISTRY_IMAGE/order:latest"

        docker tag "$CI_REGISTRY_IMAGE/delivery:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/delivery:latest"
        docker push "$CI_REGISTRY_IMAGE/delivery:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ----------------------------------------------------
# 3. Стадия деплоя на сервер по SSH (Пункт 14)
# ----------------------------------------------------
deploy-production:
  stage: deploy
  image: alpine:3.22
  timeout: 10 minutes
  resource_group: production
  variables:
    SSH_HOST: "136.234.238.30"
    SSH_USER: "root"
    DEPLOY_DIR: "/home/kabanovae"
    PROXY_APP_ALIAS: "kabanovae"
  environment:
    name: production
    url: http://kabanovae.9593647-gu32875.twc1.net
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
  script:
    - |
      ssh -i ~/.ssh/id_deploy \
        -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST" \
        "mkdir -p '$DEPLOY_DIR'"
      scp -i ~/.ssh/id_deploy \
        -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        compose.yaml "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/compose.yaml"
    - |
      printf '%s\n' "$CI_REGISTRY_PASSWORD" | ssh -i ~/.ssh/id_deploy \
        -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST" \
        "set -eu
         cd '$DEPLOY_DIR'
         docker compose version
         export DOCKER_CONFIG=\$(mktemp -d)
         trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
         docker login '$CI_REGISTRY' --username '$CI_REGISTRY_USER' --password-stdin
         umask 077
         if [ ! -s .postgres-password ]; then
           od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]' > .postgres-password
         fi
         db_password=\$(cat .postgres-password)
         test \"\${#db_password}\" -eq 64
         
         cat <<EOF > .env
GATEWAY_IMAGE=$CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA
AUTH_IMAGE=$CI_REGISTRY_IMAGE/auth:$CI_COMMIT_SHA
CATALOG_IMAGE=$CI_REGISTRY_IMAGE/catalog:$CI_COMMIT_SHA
ORDER_IMAGE=$CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA
DELIVERY_IMAGE=$CI_REGISTRY_IMAGE/delivery:$CI_COMMIT_SHA
POSTGRES_PASSWORD=\$db_password
PROXY_APP_ALIAS=$PROXY_APP_ALIAS
EOF
         docker compose config --quiet
         docker network inspect nginx-proxy >/dev/null 2>&1 || docker network create nginx-proxy
         docker compose pull
         docker compose up -d --wait --wait-timeout 90
         docker compose ps"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
