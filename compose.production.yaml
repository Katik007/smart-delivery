services:
  gateway:
    ports: !reset []
    environment:
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}-auth-service-1:8001
      CATALOG_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}-catalog-service-1:8002
      ORDER_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}-order-service-1:8003
      DELIVERY_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}-delivery-service-1:8004
    networks: !override
      backend:
      nginx-proxy:
        aliases:
          - kabanovae-smartdelivery

networks:
  nginx-proxy:
    external: true
