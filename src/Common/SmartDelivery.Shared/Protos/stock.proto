syntax = "proto3";

option csharp_namespace = "SmartDelivery.Shared.Protos";

package smartdelivery;

service StockService {
  rpc CheckAndReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
}

message StockItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  repeated StockItemRequest items = 2;
}

message ReserveStockResponse {
  bool success = 1;
  string message = 2;
  repeated string unavailable_product_ids = 3;
}

message ReleaseStockRequest {
  string order_id = 1;
  repeated StockItemRequest items = 2;
}

message ReleaseStockResponse {
  bool success = 1;
  string message = 2;
}
